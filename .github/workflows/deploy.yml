name: Deploy to Cloudflare

on:
  workflow_dispatch:
    inputs:
      apply_migrations:
        description: Apply pending D1 migrations to production; migration 0007 resets the positions history.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - run: npm test
      - name: Apply production migrations
        if: inputs.apply_migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CI: true
        run: npx wrangler d1 migrations apply cable-guard --remote
      - name: Check production migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute cable-guard --remote --command='SELECT name FROM d1_migrations' --json > /tmp/applied-migrations.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const response = JSON.parse(fs.readFileSync('/tmp/applied-migrations.json', 'utf8'));
          const applied = new Set(response.flatMap(result => result.results).map(row => row.name));
          const pending = fs.readdirSync('migrations').filter(name => name.endsWith('.sql') && !applied.has(name));
          if (pending.length) {
            console.error('Pending migrations require review before deployment:', pending.join(', '));
            process.exit(1);
          }
          console.log('All production migrations are applied.');
          NODE
      - name: Deploy Worker and assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
